<style>

*{box-sizing:border-box}
body{margin:0;font:15px/1.55 var(--ui),var(--ur),"Segoe UI",Arial,sans-serif;font-variant-numeric:tabular-nums;background:var(--bg);color:var(--t)}

function tdSave(id){const title=$('#tt').value.trim();if(!title)return alert('Enter the task');const o={title,notes:$('#tn').value.trim(),due:$('#tdd').value,priority:(document.querySelector('input[name=tp]:checked')||{}).value||'Medium',cats:[...document.querySelectorAll('.tc:checked')].map(e=>e.value),alert:$('#tal').checked,done:$('#tdx').checked};if(id){const t=TDL().find(x=>x.id==id);o.doneAt=o.done?(t.done&&t.doneAt?t.doneAt:td):'';Object.assign(t,o)}else TDL().push({...o,id:uid(),created:td,doneAt:o.done?td:''});save();cl();route()}

  try{
   await attachLocalImagesToData();
   saveLocal();
   const payload=JSON.stringify(D),bytes=new Blob([payload]).size;
   if(bytes>900000)throw new Error('Cloud record is too large ('+Math.round(bytes/1024)+' KB). CNIC images are included, but Firestore has a 1 MiB document limit. Reduce old form images or enable Firebase Storage rules.');

 function listen(){
 if(unsub){unsub();unsub=null}
 const ref=getDb().collection('school').doc('business_'+code);
 paint('🔄 Connecting…');
 unsub=ref.onSnapshot(snap=>{
  if(!connected)return;
  if(!snap.exists){paint('Uploading this device’s data…');pushNow();return}
  const v=snap.data()||{},remoteTs=Number(v.updatedAt)||0;
  if(remoteTs>lastTs){applyRemote(v.data,remoteTs)}
  else if(remoteTs<lastTs){schedulePush()}
  else{
   if(!imageMigrationAttempted){imageMigrationAttempted=true;attachLocalImagesToData().then(changed=>changed?pushNow():restoreImagesFromData()).then(()=>paint('✅ Synced data + CNIC pictures at '+stamp())).catch(e=>paint('⚠ Image restore error: '+(e.code||e.message||e)));}
   else restoreImagesFromData().then(()=>paint('✅ Synced data + CNIC pictures at '+stamp())).catch(e=>paint('⚠ Image restore error: '+(e.code||e.message||e)));
  }
 },e=>paint('⚠ Connection error: '+(e.code||e.message||e)));
}
 async function connect(c){c=String(c||'').trim().replace(/[^A-Za-z0-9_-]/g,'');if(c.length<8){alert('Enter a valid Sync code, or tap Generate first.');return}code=c;imageMigrationAttempted=false;lastTs=Number(localStorage.getItem(tsKey())||0);localStorage.setItem(STORE_CODE,code);try{await loadSDK();getDb();connected=true;listen()}catch(e){connected=false;paint('⚠ '+e.message);alert(e.message)}}
 function generate(){const chars='abcdefghjkmnpqrstuvwxyz23456789';const a=new Uint8Array(20);crypto.getRandomValues(a);let out='';a.forEach(n=>out+=chars[n%chars.length]);return out}
 function disconnect(){if(unsub){unsub();unsub=null}connected=false;code='';localStorage.removeItem(STORE_CODE);clearTimeout(timer);paint('Disconnected — this device is using local data only')}
 function push(){if(connected&&!applying)schedulePush()}
 function text(){return status}
 window.addEventListener('online',()=>{if(connected){paint('Internet restored — syncing…');schedulePush()}});
 window.addEventListener('offline',()=>{if(connected)paint('📴 Offline — changes are saved on this device')});
 if(code){connect(code)}
 return{connect,generate,disconnect,push,text,code:()=>code};
})();

{const _saveNotify=save;save=function(){_saveNotify();QB_SYNC.push()}}
