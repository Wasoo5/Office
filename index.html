loans:{n:'Loan Management',e:'🏦',f:P('name:Name|amount:Amount (PKR):n|date:Date:d|type:Loan Type:s:ltype|status:Status:s:lstat|received:Amount Received:n|recDate:Received Date:d|remarks:Remarks'),x:r=>({Remaining:nf(Math.max(0,(+r.amount||0)-rec(r)))})},
borrowed:{n:'Borrowed Office Loans',e:'🤝',f:P('name:Lender Name|amount:Amount (PKR):n|date:Date:d|status:Status:s:lstat|paid:Amount Paid:n|remarks:Remarks'),x:r=>({Remaining:nf(brr(r))})},
self:{n:'Self Expense',e:'👤',f:P('partner:Partner:s:partner|amount:Amount (PKR):n|date:Date:d|remarks:Remarks')},
process:{n:'Process Tracking',e:'🔄',f:P('date:Date:d|name:Customer|type:Process Type:s:ptype|tracking:Tracking ID|duration:Duration:s:dur|status:Status:s:pstat|received:Received:s:yn|recDate:Received Date:d|paidDate:Paid Date:d'),x:r=>{const h=r.duration=='2 Hours',lim={'31 Days':31,'15 Days':15,'7 Days':7,'2 Hours':1/12}[r.duration],dn_=r.received=='Yes',el=dn(r.date,end(dn_,r.recDate)),st=dn_?'Completed':el>lim?'Over Date':'In Process';return{Counting:h?(el*24).toFixed(1)+' hrs':Math.floor(el)+' days',Processing:st,Alert:!dn_&&el>=5&&/^(unpaid|unapproved)$/i.test(r.status)?'Too late - check':'',_c:dn_?'ok':st=='Over Date'?'bad':''}}},
uc:{n:'Union Council',e:'🏛',f:P('date:Date:d|person:Person:s:ucp|category:Work:s:ucc|name:Name|status:Status:s:ucs|docs:Docs Received:s:yn')},
domicile:{n:'Domicile',e:'🏠',f:P('date:Date:d|name:Name / Father:t|person:Person:s:dp|status:Status:s:ds|received:Received to us:s:yn|recDate:Received Date:d|notes:Notes'),x:r=>{const dn_=r.received=='Yes';return{Final:dn_?'Completed':r.status,Days:Math.floor(dn(r.date,end(dn_,r.recDate))),_c:dn_?'ok':r.status=='File ready'?'warn':r.status=='Submitted'?'info':''}}},
complaints:{n:'Complaints',e:'📢',f:P('date:Date:d|name:Name|type:Type:s:ct|no:Complaint No.|status:Status:s:cs|resolved:Resolved Date:d'),x:r=>{const s=r.status=='Resolved',d=Math.floor(dn(r.date,end(s,r.resolved)));return{Days:d,Remarks:s?'Resolved':d>5?'Check the complaint status':'Pending',_c:s?'ok':d>5?'bad':''}}},
customers:{n:'Customers',e:'👥',f:P('date:Date:d|name:Name|phone:Phone|work:Work:s:cw|fee:Fee Taken:s:yn|amount:How Many (PKR):n|remarks:Remarks:s:cr'),x:r=>({Fee:r.fee=='Yes'?nf(r.amount):'No money'})},
appts:{n:'Appointments',e:'📅',f:P('date:Entry Date:d|name:Name|work:Work:s:aw|apptDate:Appointment Date:d|time:Time:s:at|status:Status:s:as|remarks:Remarks'),x:r=>{let m='';if(r.status!='Done'&&r.apptDate){const a=apDT(r),mi=Math.round((a-new Date)/6e4),d=Math.round(dn(td,D0(r.apptDate))),t=r.time||'';m=mi<0?'MISSED '+fd(r.apptDate)+' '+t:mi<=60?'IN '+mi+' MIN '+t:d==0?'TODAY '+t:d==1?'TOMORROW '+t:''}return{Reminder:m,_c:/^(MISSED|IN )/.test(m)?'bad':m?'warn':r.status=='Done'?'ok':''}}},
rates:{n:'Rate List',e:'📋',f:P('name:Item / Service|rate:Rate (PKR):n')}};
const X=(k,r)=>M[k].x?M[k].x(r):{};
const val=(f,v)=>f.t=='d'?fd(v):f.t=='n'?(v===''||v==null?'':nf(v)):esc(v);
const dlg=h=>{$('#dlg').innerHTML=h;$('#dlg').showModal()},cl=()=>$('#dlg').close();
const bk=(k)=>[...D[k]].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
/* ---------- module pages ---------- */
function rowsHtml(k,q){const m=M[k];return bk(k).filter(r=>!q||JSON.stringify(Object.values(r)).toLowerCase().includes(q.toLowerCase())).map(r=>{const x=X(k,r);return`<tr class="${x._c||''}" onclick="edit('${k}','${r.id}')">`+m.f.map(f=>`<td>${val(f,r[f.k])}</td>`).join('')+Object.keys(x).filter(a=>a[0]!='_').map(a=>`<td>${esc(x[a])}</td>`).join('')+'</tr>'}).join('')}
function mod(k){if(k=='borrowed')return bor();const m=M[k],xs=Object.keys(X(k,{})).filter(a=>a[0]!='_');$('#app').innerHTML=`<h2>${m.e} ${m.n} (${D[k].length})</h2><div class="bar"><input id=q placeholder="Search..." oninput="$('#tb').innerHTML=rowsHtml('${k}',this.value)"><button onclick="edit('${k}')">+ Add</button><a class="btn g" href="#rep-${k}">📊 Report</a></div><div class="tw"><table><thead><tr>${m.f.map(f=>`<th>${f.l}</th>`).join('')}${xs.map(a=>`<th>${a}</th>`).join('')}</tr></thead><tbody id=tb>${rowsHtml(k)}</tbody></table></div>`}
function inp(f,v){return f.t=='s'?`<select id="f_${f.k}"><option></option>${[...new Set([...L[f.o],v].filter(Boolean))].map(o=>`<option${o==v?' selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t=='d'?'date':f.t=='n'?'number':'text'}" ${f.t=='n'?'step=any inputmode=decimal':''} value="${esc(v)}">`}
function edit(k,id){const m=M[k],r=id?D[k].find(x=>x.id==id):{date:td};dlg(`<h3>${m.e} ${m.n}</h3>${m.f.map(f=>`<label>${f.l}${inp(f,r[f.k]??'')}</label>`).join('')}<div class="bar"><button onclick="sv('${k}','${id||''}')">Save</button><button class="g" onclick="cl()">Cancel</button>${id?`<button class="r" onclick="del('${k}','${id}')">Delete</button>`:''}</div>`)}
function sv(k,id){const o={};M[k].f.forEach(f=>{let v=$('#f_'+f.k).value;o[f.k]=f.t=='n'&&v!==''?+v:v});if(!Object.values(o).some(v=>v!==''&&v!==td))return;if(id)Object.assign(D[k].find(x=>x.id==id),o);else{const n=k=='borrowed'?{no:Math.max(0,...D.borrowed.map(x=>+x.no||0))+1}:{};D[k].push({...o,...n,id:uid()})}save();cl();route()}
function del(k,id){if(confirm('Delete this record?')){D[k]=D[k].filter(x=>x.id!=id);save();cl();route()}}

/* ---------- loans taken by office ---------- */
const brRows=(rows,click)=>rows.map(r=>`<tr class="${brc(r)}"${click?` onclick="edit('borrowed','${r.id}')"`:''}><td>${String(r.no).padStart(4,'0')}</td><td>${fd(r.date)}</td><td>${esc(r.name)}</td><td class="num">${nf(r.amount)}</td><td>${brb(r)}</td><td class="num">${nf(brp(r))}</td><td class="num">${nf(brr(r))}</td></tr>`).join(''),
brFoot=rows=>`<tr class="tot"><td></td><td></td><td>TOTAL (${rows.length})</td><td class="num">${nf(sum(rows))}</td><td></td><td class="num">${nf(rows.reduce((a,r)=>a+brp(r),0))}</td><td class="num">${nf(rows.reduce((a,r)=>a+brr(r),0))}</td></tr>`,
brHead='<tr><th>No.</th><th>Date</th><th>Lender</th><th>Amount</th><th>Status</th><th>Paid</th><th>Remaining</th></tr>';
function bor(){const rows=[...D.borrowed].sort((a,b)=>a.no-b.no);$('#app').innerHTML=`<h2>🤝 Borrowed Office Loans (${rows.length})</h2><div class="bar"><button onclick="edit('borrowed')">+ Add Loan</button><a class="btn g" href="#rep-borrowed">📊 Report</a></div><div class="grid">${kp('Total loans taken',rs(sum(rows)))}${kp('Paid back',rs(rows.reduce((a,r)=>a+brp(r),0)))}${kp('Remaining to pay',rs(rows.reduce((a,r)=>a+brr(r),0)))}</div><div class="tw"><table><thead>${brHead}</thead><tbody>${brRows(rows,1)}${rows.length?brFoot(rows):'<tr><td colspan=7>No loans yet. Tap + Add Loan.</td></tr>'}</tbody></table></div>`}
function bordash(){const B=D.borrowed.filter(r=>inR(r.date)).sort((a,b)=>a.no-b.no),n=st=>B.filter(r=>r.status==st).length;return `<h2>🤝 Borrowed Office Loans</h2><div class="grid">${kp('Total loans taken',rs(sum(B)),B.length+' loans')}${kp('Paid back',rs(B.reduce((a,r)=>a+brp(r),0)),n('Paid')+' paid | '+n('Partially Paid')+' partial')}${kp('Remaining to pay',rs(B.reduce((a,r)=>a+brr(r),0)),n('Unpaid')+' unpaid')}</div><div class="tw"><table><thead>${brHead}</thead><tbody>${brRows(B.slice(-8),1)}${B.length?brFoot(B):'<tr><td colspan=7>No loans yet.</td></tr>'}</tbody></table></div><div class="bar"><a class="btn" href="#m-borrowed">Open all loans</a><button class="g" onclick="edit('borrowed')">+ Add Loan</button></div>`}
/* ---------- receipts ---------- */
const rt=r=>sum(r.items.map(i=>({a:(+i.q||1)*(+i.rt||0)})),'a'),rn=r=>rt(r)-(+r.disc||0);
function rcList(){$('#app').innerHTML=`<h2>🧾 Receipts (${D.receipts.length})</h2><div class="bar"><button onclick="rcEdit()">+ New receipt</button></div><div class="tw"><table><thead><tr><th>No.</th><th>Date</th><th>Customer</th><th>Services</th><th>Total (Rs)</th><th></th></tr></thead><tbody>${[...D.receipts].sort((a,b)=>b.no-a.no).map(r=>`<tr onclick="rcEdit('${r.id}')"><td>${String(r.no).padStart(4,'0')}</td><td>${fd(r.date)}</td><td>${esc(r.cust)}</td><td>${r.items.length}</td><td>${nf(rn(r))}</td><td><a class="btn" href="#rp-${r.id}" onclick="event.stopPropagation()">🖨 A4</a></td></tr>`).join('')}</tbody></table></div>`}
const itRow=i=>`<div class="it bar"><select style="flex:2" onchange="const x=D.rates.find(x=>x.name==this.value);this.parentNode.querySelector('.rt').value=x?x.rate:''"><option></option>${D.rates.map(x=>`<option${x.name==i.s?' selected':''}>${esc(x.name)}</option>`).join('')}</select><input class="q" type=number placeholder=Qty value="${i.q??1}" style="width:60px"><input class="rt" type=number placeholder=Rate value="${i.rt??''}" style="width:80px"><input class="rm" placeholder=Remarks value="${esc(i.rm)}"></div>`;
function rcEdit(id){const r=id?D.receipts.find(x=>x.id==id):{date:td,items:[{}]};dlg(`<h3>🧾 Receipt ${r.no?String(r.no).padStart(4,'0'):'(new)'}</h3><label>Date<input id=rd type=date value="${r.date}"></label><label>Customer<input id=rc value="${esc(r.cust)}"></label><div id=ri>${r.items.map(itRow).join('')}</div><button class="g" onclick="$('#ri').insertAdjacentHTML('beforeend',itRow({}))">+ Service</button><label>Discount (Rs)<input id=rx type=number value="${r.disc||0}"></label><div class="bar"><button onclick="rcSave('${id||''}')">Save</button>${id?`<a class="btn g" href="#rp-${id}" onclick="cl()">🖨 Print A4</a><button class="r" onclick="del('receipts','${id}')">Delete</button>`:''}<button class="g" onclick="cl()">Cancel</button></div>`)}
function rcSave(id){const items=[...document.querySelectorAll('.it')].map(e=>({s:e.querySelector('select').value,q:+e.querySelector('.q').value||1,rt:+e.querySelector('.rt').value||0,rm:e.querySelector('.rm').value})).filter(i=>i.s),o={date:$('#rd').value,cust:$('#rc').value,disc:+$('#rx').value||0,items};if(!o.cust||!items.length)return alert('Enter customer and at least one service');if(id)Object.assign(D.receipts.find(x=>x.id==id),o);else D.receipts.push({...o,id:uid(),no:Math.max(0,...D.receipts.map(x=>x.no))+1});save();cl();route()}

const toast=(t,c='late')=>{const e=document.createElement('div');e.className='al '+c;e.innerHTML='<span class="ai">⏳</span><span>'+esc(t)+'</span>';e.onclick=()=>e.remove();$('#ts').appendChild(e);setTimeout(()=>e.remove(),20000)};
const beep=()=>{try{const a=new(window.AudioContext||window.webkitAudioContext),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(a.currentTime+.35)}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}};
const askN=()=>{try{Notification.requestPermission().then(()=>home())}catch(e){alert('Pop-up alerts are not supported in this browser. In-app alerts still work while the app is open.')}};
let NK={};try{NK=JSON.parse(localStorage.qbn||'{}')}catch(e){}
const ping=()=>{for(const k in NK)if(k.split('|')[1]<td)delete NK[k];D.appts.forEach(r=>{if(r.status=='Done'||!r.apptDate)return;const a=apDT(r);if(!a)return;const mi=Math.round((a-new Date)/6e4),lv=mi<=0&&mi>-30?0:mi>0&&mi<=15?15:mi>15&&mi<=60?60:null;if(lv==null)return;const k=r.id+'|'+r.apptDate+'|'+r.time+'|'+lv;if(NK[k])return;NK[k]=1;try{localStorage.qbn=JSON.stringify(NK)}catch(e){}const t=(lv==0?'NOW: ':'IN '+mi+' MIN: ')+r.name+' ('+r.work+') at '+r.time;toast(t,lv?'late':'bad');beep();try{if(window.Notification&&Notification.permission=='granted')new Notification('Appointment reminder',{body:t})}catch(e){}})};
const tick=()=>{T=new Date;td=ymd(T);ping();badge();const sg=alerts().join('|')+td;if(sg==tick.s)return;tick.s=sg;const h=location.hash.slice(1)||'home',ae=(document.activeElement||{}).tagName||'';if($('#dlg').open||/INPUT|SELECT/.test(ae))return;if(h=='home')home();else if(h=='m-appts')mod('appts')};
/* ---------- backup + router ---------- */
function setp(){$('#app').innerHTML=`<h2>🗄 Backup &amp; Restore</h2><div class="card"><p>Data is saved in this browser on this device. Save a backup file regularly and use it to move data between phone and computer.</p><div class="bar"><button onclick="bkp()">⬇ Download backup</button><label class="btn g" style="margin:0">⬆ Restore<input type=file accept=.json hidden onchange="rst(this.files[0])"></label><button class="r" onclick="if(confirm('Erase all data and reload sample data?')){delete localStorage.qbm;location.reload()}">Reset</button></div></div>`}
function bkp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='qureshi-backup-'+td+'.json';a.click()}
function rst(f){f&&f.text().then(t=>{try{D=JSON.parse(t);save();alert('Restored');location.hash='home';route()}catch(e){alert('Invalid file')}})}
function go(h){location.hash=h}
function route(){T=new Date;td=ymd(T);document.getElementById('pgs')?.remove();const[p,a]=(location.hash.slice(1)||'home').split(/-(.*)/s);({home,rcpt:rcList,rep:()=>rep(a),find,set:setp,rp:()=>rcPrint(a),m:()=>mod(a)}[p]||home)();scrollTo(0,0);badge();tick.s=alerts().join('|')+td}
addEventListener('hashchange',route);addEventListener('resize',fit);route();ping();setInterval(tick,30000);addEventListener('visibilitychange',()=>{document.hidden||tick()});
</script></body></html>
